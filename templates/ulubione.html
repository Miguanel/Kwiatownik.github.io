{% extends "base.html" %}
{% block title %}Ulubione i ogród{% endblock %}
{% block content %}

<div class="page">
    <h2>Ulubione rośliny</h2>
    <div class="fav-list-scrollbox">
        <ul id="fav-list"></ul>
    </div>

    <h2>Rośliny mam w ogrodzie</h2>
    <div class="fav-list-scrollbox">
        <ul id="garden-list"></ul>
    </div>

    <h2>Kalendarz siewu i zbioru (ulubione rośliny)</h2>
    <div id="calendar-legend"></div>
    <div id="calendar"></div>

    <h2 style="margin-top:2em;">Kalendarz siewu i zbioru (rośliny w ogrodzie)</h2>
    <div id="calendar-garden"></div>
</div>

<script>
const allPlantsData = {{ all_plants|tojson|safe }};

const eventIcons = {
    siew: '🌱', sadzenie: '🥬', zbior: '🍃', zbior_ziele: '🌿', zbior_lisci: '🍃',
    zbior_kwiatow: '🌼', zbior_korzeni: '🦷', zbior_nasion: '🌾', kwitnienie: '🌸',
    przesadzanie: '🪴', pielenie: '🧤', przycinanie: '✂️', rozmnazanie: '🧬',
    zabezpieczanie: '🧣', ciecie: '✂️', nawozenie: '💩', ochrona: '🛡️',
    zbior_poranny: '🌅', zbior_pelnia: '🌕', ekstrakcja: '🧪', miodobranie: '🐝', zbior_po_deszczu: '💧'
};
const eventNames = {
    siew: 'Siew', sadzenie: 'Sadzenie', zbior: 'Zbiór owoców', zbior_ziele: 'Zbiór ziela',
    zbior_lisci: 'Zbiór liści', zbior_kwiatow: 'Zbiór kwiatów', zbior_korzeni: 'Zbiór korzeni',
    zbior_nasion: 'Zbiór nasion', kwitnienie: 'Kwitnienie', przesadzanie: 'Przesadzanie',
    pielenie: 'Pielenie', przycinanie: 'Przycinanie', rozmnazanie: 'Rozmnażanie',
    zabezpieczanie: 'Zabezpieczanie', ciecie: 'Cięcie', nawozenie: 'Nawożenie', ochrona: 'Ochrona',
    zbior_poranny: 'Zbiór poranny', zbior_pelnia: 'Zbiór w pełni księżyca',
    ekstrakcja: 'Ekstrakcja', miodobranie: 'Miodobranie', zbior_po_deszczu: 'Zbiór po deszczu'
};

function getAllEventTypes(plants) {
    let eventTypes = new Set();
    plants.forEach(plant => {
        if (!plant || !plant.data || !plant.data.kalendarz) return;
        Object.keys(plant.data.kalendarz).forEach(ev => eventTypes.add(ev));
    });
    return Array.from(eventTypes);
}

// --- LEGEND STATE z localStorage ---
let visibleTypes = {};
let allTypes = [];
function loadLegendState() {
    try {
        let v = JSON.parse(localStorage.getItem("calendar_legend_types") || "{}");
        if (typeof v === "object") visibleTypes = v;
    } catch(e) {}
}
function saveLegendState() {
    localStorage.setItem("calendar_legend_types", JSON.stringify(visibleTypes));
}
window.onLegendChange = function(type, isChecked) {
    visibleTypes[type] = isChecked;
    saveLegendState();
    document.getElementById('calendar-legend').innerHTML = renderLegend(allTypes, visibleTypes);
    showCalendar();
    showCalendarGarden();
};

// --- FLEX legend (ikonka, checkbox, nazwa) ---
function renderLegend(eventTypes, visibleTypes) {
    return `<div class="legend-flex"><b>Legenda:</b>` +
        eventTypes.map(ev => `
            <label class="legend-item">
                <input type="checkbox" data-type="${ev}" ${visibleTypes[ev] ? "checked" : ""} onchange="window.onLegendChange && window.onLegendChange('${ev}', this.checked)">
                <span class="legend-icon" title="${eventNames[ev] || ev}">${eventIcons[ev] || '❓'}</span>
                <span class="legend-name">${eventNames[ev] || ev}</span>
            </label>
        `).join('') +
        `<span style="margin-left:1.2em;">
            <span style="display:inline-block;width:20px;height:16px;background:#c7ebb8;border-radius:3px;border:1px solid #acd09a;margin-right:0.3em;vertical-align:middle;"></span>
            – aktualny miesiąc
        </span></div>`;
}

function renderCalendarTable(plants, visibleTypes) {
    let now = new Date();
    let thisMonth = now.getMonth() + 1; // 1-indexed
    let months = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
    let html = `<div class="calendar-scrollbox"><table class='calendar-table' style='margin-top:0.9em; border-collapse:collapse;'>
        <tr><th>Roślina</th>`;
    for (let m = 0; m < 12; m++) {
        html += `<th class="calendar-month${m + 1 === thisMonth ? ' calendar-month-current' : ''}">${months[m]}</th>`;
    }
    html += "<th>Status</th></tr>";
    plants.forEach(function(plant) {
        if (!plant) return;
        let kal = plant.data.kalendarz || {};
        let eventList = [];
        Object.keys(kal).forEach(ev => {
            if (!visibleTypes[ev]) return;
            let arr = kal[ev];
            arr.forEach(m => {
                eventList.push({ month: m, label: ev });
            });
        });
        let minWeeks = null;
        let eventsByMonth = {};
        eventList.forEach(ev => {
            let m = Number(ev.month);
            let eventYear = now.getFullYear();
            if (m < thisMonth) eventYear += 1;
            let isCurrentMonth = (m === thisMonth);
            let eventDate = new Date(eventYear, m - 1, 1);
            let weeks = Math.round((eventDate - now) / (1000 * 60 * 60 * 24 * 7));
            if (isCurrentMonth) weeks = 0;
            if (minWeeks === null || weeks < minWeeks) minWeeks = weeks;
            if (!eventsByMonth[weeks]) eventsByMonth[weeks] = [];
            eventsByMonth[weeks].push(ev.label);
        });

        html += `<tr>
        <td style="white-space:nowrap;">
            <div style="display:flex;align-items:center;gap:0.7em;">
                ${makePlantMiniImage(plant.data.zdjecia, plant.name)}
                <span>${plant.name}</span>
            </div>
        </td>`;
        for (let m = 1; m <= 12; m++) {
            let ikony = '';
            Object.keys(kal).forEach(ev => {
            if (!visibleTypes[ev]) return;
            if (kal[ev] && kal[ev].includes(m)) {
                let icon = eventIcons[ev] || '';
                let name = eventNames[ev] || ev;
                ikony += `<span class="event-icon" title="${name}" data-tooltip="${name}">${icon}</span>`;
            }
        });
    html += `<td style="text-align:center;min-width:28px;">${ikony}</td>`;
        }

        if (minWeeks !== null && minWeeks >= 0) {
            let uniqueLabels = Array.from(new Set(eventsByMonth[minWeeks])).sort();
            let textLabels = uniqueLabels.map(l => `<b>${eventNames[l] || l}</b>`).join(", ");
            html += `<td style="color:#39790e;font-weight:bold;">`;
            if (minWeeks === 0)
                html += `<span style="color:#d95d1a;">Trwa ${textLabels}!</span>`;
            else
                html += `Za ${minWeeks} tyg. → ${textLabels}`;
            html += `</td>`;
        } else {
            html += `<td style="color:#999;">Brak nadchodzących wydarzeń</td>`;
        }
        html += "</tr>";
    });
    html += "</table></div>";
    return html;
}

document.addEventListener("DOMContentLoaded", function() {
    showFavList();
    showGardenList();

    let plants = [];
    getFavs().forEach(function(path) {
        let [cat, slug] = path.split("/");
        let plant = allPlantsData.find(p => p.category === cat && p.slug === slug);
        if (plant) plants.push(plant);
    });
    getGarden().forEach(function(path) {
        let [cat, slug] = path.split("/");
        let plant = allPlantsData.find(p => p.category === cat && p.slug === slug);
        if (plant) plants.push(plant);
    });
    allTypes = getAllEventTypes(plants);

    // LEGEND STATE: ładowanie i domyślne ustawienie
    loadLegendState();
    if (!Object.keys(visibleTypes).length) {
        allTypes.forEach(ev => visibleTypes[ev] = true);
    }

    showCalendar();
    showCalendarGarden();
    enableCalendarScroll('calendar');
    enableCalendarScroll('calendar-garden');
    document.getElementById('calendar-legend').innerHTML = renderLegend(allTypes, visibleTypes);
});

function showCalendar() {
    let favs = getFavs();
    let root = document.getElementById("calendar");
    if (favs.length == 0) {
        root.innerHTML = "<i>Brak roślin w ulubionych.</i>";
        return;
    }
    let plants = favs.map(function(path) {
        let [cat, slug] = path.split("/");
        return allPlantsData.find(p => p.category === cat && p.slug === slug);
    }).filter(Boolean);
    root.innerHTML = renderCalendarTable(plants, visibleTypes);

    let scrollBox = root.querySelector('.calendar-scrollbox');
    if(scrollBox) {
        let active = scrollBox.querySelector('.calendar-month-current');
        if(active) {
            let boxWidth = scrollBox.offsetWidth;
            let left = active.offsetLeft;
            let thWidth = active.offsetWidth;
            let scrollTo = left - (boxWidth / 2) + (thWidth / 2);
            scrollBox.scrollLeft = Math.max(scrollTo, 0);
        }
    }
}

function showCalendarGarden() {
    let garden = getGarden();
    let root = document.getElementById("calendar-garden");
    if (garden.length == 0) {
        root.innerHTML = "<i>Nie masz roślin w ogrodzie.</i>";
        return;
    }
    let plants = garden.map(function(path) {
        let [cat, slug] = path.split("/");
        return allPlantsData.find(p => p.category === cat && p.slug === slug);
    }).filter(Boolean);
    root.innerHTML = renderCalendarTable(plants, visibleTypes);

    let scrollBox = root.querySelector('.calendar-scrollbox');
    if(scrollBox) {
        let active = scrollBox.querySelector('.calendar-month-current');
        if(active) {
            let boxWidth = scrollBox.offsetWidth;
            let left = active.offsetLeft;
            let thWidth = active.offsetWidth;
            let scrollTo = left - (boxWidth / 2) + (thWidth / 2);
            scrollBox.scrollLeft = Math.max(scrollTo, 0);
        }
    }
}

function getFavs() {
    return JSON.parse(localStorage.getItem("favs") || "[]");
}
function setFavs(val) {
    localStorage.setItem("favs", JSON.stringify(val));
}
function getGarden() {
    return JSON.parse(localStorage.getItem("garden") || "[]");
}
function makePlantImage(urls, alt, thumbClass) {
    if (!urls || urls.length === 0) {
        return `<span class="${thumbClass}-empty"></span>`;
    }
    return `<img src="${urls[0]}" alt="${alt}" class="${thumbClass}" loading="lazy"
                data-imglist='${JSON.stringify(urls)}' data-imgidx="0">`;
}
function makePlantMiniImage(urls, alt) {
    if (!urls || urls.length === 0) {
        return `<span class="plant-thumb-mini-empty"></span>`;
    }
    return `<img src="${urls[0]}" alt="${alt}" class="plant-thumb-mini" loading="lazy"
                data-imglist='${JSON.stringify(urls)}' data-imgidx="0">`;
}

function showFavList() {
    let favs = getFavs();
    let ul = document.getElementById("fav-list");
    ul.innerHTML = "";
    if (favs.length === 0) {
        ul.innerHTML = "<li>Brak ulubionych roślin.</li>";
        return;
    }
    favs.forEach(function(path) {
        let [cat, slug] = path.split("/");
        let plant = allPlantsData.find(p => p.category === cat && p.slug === slug);
        if (!plant) return;
        let img = makePlantImage(plant.data.zdjecia, plant.name, 'plant-thumb');
        ul.innerHTML += `
        <li class="fav-li">
            <div class="fav-main">
                <a href="/${cat}/${slug}" class="fav-link"><b>${plant.name}</b></a>
                <i class="fav-latin">(${plant.latin})</i>
                <span class="fav-path">${plant.data.nazwa_zbioru ? plant.data.nazwa_zbioru.join(" → ") : ""}</span>
                <button class="fav-remove" onclick="removeFav('${cat}/${slug}')" title="Usuń z ulubionych">❌</button>
            </div>
            ${img}
        </li>`;
    });
}

function removeFav(path) {
    let favs = getFavs();
    let idx = favs.indexOf(path);
    if(idx !== -1) {
        favs.splice(idx, 1);
        setFavs(favs);
        showFavList();
        showCalendar();
        showCalendarGarden();
    }
}

function showGardenList() {
    let g = getGarden();
    let ul = document.getElementById("garden-list");
    ul.innerHTML = "";
    if (g.length === 0) {
        ul.innerHTML = "<li>Nie masz roślin w ogrodzie.</li>";
        return;
    }
    g.forEach(function(path) {
        let [cat, slug] = path.split("/");
        let plant = allPlantsData.find(p => p.category === cat && p.slug === slug);
        if (!plant) return;
        let img = makePlantImage(plant.data.zdjecia, plant.name, 'plant-thumb');
        ul.innerHTML += `
        <li class="fav-li">
            <div class="fav-main">
                <a href="/${cat}/${slug}" class="fav-link"><b>${plant.name}</b></a>
                <i class="fav-latin">(${plant.latin})</i>
                <span class="fav-path">${plant.data.nazwa_zbioru ? plant.data.nazwa_zbioru.join(" → ") : ""}</span>
            </div>
            ${img}
        </li>`;
    });
}

// Obsługa awarii ładowania obrazków
document.body.addEventListener('error', function(e) {
    let el = e.target;
    if (el.classList.contains('plant-thumb') || el.classList.contains('plant-thumb-mini')) {
        let imgs = [];
        try { imgs = JSON.parse(el.getAttribute('data-imglist') || "[]"); } catch {}
        let idx = Number(el.getAttribute('data-imgidx') || 0) + 1;
        if (imgs && idx < imgs.length) {
            el.setAttribute('data-imgidx', idx);
            el.src = imgs[idx];
        } else {
            if (el.classList.contains('plant-thumb'))
                el.outerHTML = '<span class="plant-thumb-empty"></span>';
            else
                el.outerHTML = '<span class="plant-thumb-mini-empty"></span>';
        }
    }
}, true);

function enableCalendarScroll(id) {
    let root = document.getElementById(id);
    if (!root) return;
    root.addEventListener("mousedown", dragStart, false);
    root.addEventListener("mouseleave", dragEnd, false);
    root.addEventListener("mouseup", dragEnd, false);
    root.addEventListener("mousemove", dragMove, false);

    let isDown = false;
    let startX, startY, scrollLeft, scrollTop;

    function dragStart(e) {
        let box = e.target.closest('.calendar-scrollbox');
        if (!box) return;
        isDown = true;
        box.classList.add('dragging');
        startX = e.pageX - box.offsetLeft;
        startY = e.pageY - box.offsetTop;
        scrollLeft = box.scrollLeft;
        scrollTop = box.scrollTop;
        box._active = true;
    }
    function dragEnd(e) {
        let box = e.target.closest('.calendar-scrollbox');
        if (!box) return;
        isDown = false;
        box.classList.remove('dragging');
        box._active = false;
    }
    function dragMove(e) {
        let box = e.target.closest('.calendar-scrollbox');
        if (!box || !isDown || !box._active) return;
        e.preventDefault();
        let x = e.pageX - box.offsetLeft;
        let y = e.pageY - box.offsetTop;
        box.scrollLeft = scrollLeft - (x - startX);
        box.scrollTop = scrollTop - (y - startY);
    }
}
</script>

<style>
.fav-list-scrollbox {
    max-height: 340px;
    overflow-y: auto;
    background: #fcfff9;
    border-radius: 11px;
    box-shadow: 0 1px 6px #c9e6ca1a;
    margin-bottom: 1.2em;
    border: 1px solid #e6f3e3;
}
@media (max-width:600px) {
    .fav-list-scrollbox {
        max-height: 220px;
    }
}
.fav-li {
    display: flex;
    align-items: center;
    margin-bottom: 0.82em;
    border-bottom: 1px solid #e3eed9;
    padding-bottom: 0.39em;
    padding-right: 0.4em;
    gap: 1.3em;
}
.fav-main {
    flex:1;
    min-width: 0;
}
.fav-link { font-size: 1.13em; color: #184e10; font-weight: bold; text-decoration: underline;}
.fav-link:hover { color: #39790e; }
.fav-latin { font-size: 0.98em; color:#789044; margin-left:0.38em; }
.fav-path { color:#aaa; font-size:0.98em; margin-left: 0.5em;}
.fav-remove {
    margin-left: 1.0em;
    background: none;
    border: none;
    color: #b13722;
    font-size: 1.18em;
    cursor: pointer;
    transition: color 0.14s;
    vertical-align: middle;
}
.fav-remove:hover { color: #ee2211; }
.plant-thumb {
    width: 58px;
    height: 45px;
    object-fit: cover;
    border-radius: 12px;
    box-shadow: 0 1px 6px #0002;
    background: #f3fbe7;
}
.plant-thumb-empty {
    display: inline-block;
    width: 58px;
    height: 45px;
    border-radius: 12px;
    background: #e5efe0;
}
.plant-thumb-mini {
    width: 38px;
    height: 29px;
    object-fit: cover;
    border-radius: 9px;
    box-shadow: 0 1px 3px #0002;
    background: #f3fbe7;
    margin-right: 0.5em;
}
.plant-thumb-mini-empty {
    display: inline-block;
    width: 38px;
    height: 29px;
    border-radius: 9px;
    background: #e5efe0;
    margin-right: 0.5em;
}
.legend-flex {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1.1em 1.9em;
    margin-bottom: 0.3em;
}
.legend-item {
    display: flex;
    align-items: center;
    gap: 0.35em;
    margin-bottom: 0.12em;
    margin-right: 1.7em;
    font-size: 1em;
}
.legend-icon {
    font-size: 1.18em;
    margin-right: 0.21em;
    vertical-align: middle;
}
.legend-name {
    font-size: 1em;
}
@media (max-width:600px) {
    .legend-flex { gap: 0.65em 1.1em; }
    .legend-item { font-size: 0.97em; }
}
.calendar-table th, .calendar-table td {
    border: 1px solid #e3eed9;
    padding: 0.3em 0.42em;
    font-size: 0.99em;
}
.calendar-table th {
    background: #f3fbe7;
    color: #183e17;
    font-weight: bold;
}
.calendar-month-current, .calendar-table th.calendar-month-current {
    background: #c7ebb8 !important;
    color: #195e17 !important;
    border-bottom: 2px solid #5da44e !important;
}
.calendar-scrollbox {
    width: 100%;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: #bcd7b7 #f3fbe7;
    position: relative;
    margin-bottom: 1em;
    max-height: 400px;
    max-width: 100%;
}
.calendar-scrollbox.dragging {
    cursor: grab;
    background: #f3f7ef;
    user-select: none;
}
.calendar-scrollbox::before,
.calendar-scrollbox::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 18px;
    pointer-events: none;
    z-index: 2;
}
.calendar-scrollbox::before { left: 0; background: none; }
.calendar-scrollbox::after { right: 0; background: none; }
</style>
{% endblock %}

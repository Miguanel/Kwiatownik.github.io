{% extends "base.html" %}
{% block title %}Generator przepisów{% endblock %}
{% block content %}

<h2>Znajdź przepis według składników i efektów</h2>
<div class="search-recipes-panel">
    <form id="recipeQueryForm" autocomplete="off" onsubmit="return false;">
        <div id="search-inputs"></div>
        <div style="margin-top: 0.9em; display: flex; gap: 1em;">
            <button type="button" class="export-pdf-btn" onclick="exportResultsToPDF()">Export wyników do PDF</button>
            <button type="button" class="clear-all-btn" onclick="clearInputs()">Wyczyść wszystko</button>
        </div>
    </form>
</div>

<section id="results-section">
<!--  <h3 class="results-title" style="margin-bottom:0.9em;display:none;">Wyniki wyszukiwania</h3>-->
  <div id="searchResults"></div>
</section>
<div id="pdf-export-dialog" style="display:none;">
  <div id="pdf-dialog-bg"></div>
  <form id="pdf-dialog-form">
    <h3>Eksport wyników do PDF – opcje</h3>
    <label style="display:flex;align-items:center;gap:0.8em;margin-bottom:1.1em;">
      <input type="checkbox" id="pdf-include-highlights" checked>
      <span>Kolorowe podświetlenia wyszukiwanych fraz</span>
    </label>
    <label>
      Skalowanie czcionki w PDF:<br>
      <input type="number" id="pdf-font-scale" value="1.0" step="0.1" min="0.5" max="1.5" style="width:4.5em;font-size:1.15em;margin-top:0.2em;">
      <span style="font-size:0.99em;color:#777;">(0.5–1.5, domyślnie 1.0)</span>
    </label>
    <div style="margin-top:1.5em;display:flex;gap:1.3em;">
      <button type="submit" class="export-pdf-btn" style="margin-right:0;">Eksportuj PDF</button>
      <button type="button" class="clear-all-btn" style="background:#bbb;color:#333;" onclick="hidePdfDialog()">Anuluj</button>
    </div>
  </form>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
const allPlants = {{ all_plants|tojson|safe }};
let searchInputsDiv = document.getElementById("search-inputs");

function validQuery(val) {
    return val.length >= 3 && val.length <= 120;
}

// Zbierz wszystkie przepisy
function gatherAllRecipes() {
    let out = [];
    allPlants.forEach(plant => {
        ["przepisy_medyczne", "przepisy_kulinarne"].forEach(type => {
            let group = plant.data[type] || {};
            Object.entries(group).forEach(([nazwa, przepis]) => {
                out.push({
                    typ: type.includes("medyczne") ? "medyczny" : "kulinarny",
                    plant: plant,
                    nazwa: nazwa,
                    przepis: przepis
                });
            });
        });
        let zinnymi = plant.data.przepisy_z_innymi_roslinami || {};
        Object.entries(zinnymi).forEach(([podtyp, arr]) => {
            arr.forEach(przepis => {
                out.push({
                    typ: podtyp == "medyczne" ? "medyczny-z-innych" : "kulinarny-z-innych",
                    plant: plant,
                    nazwa: przepis.nazwa,
                    przepis: przepis
                });
            });
        });
    });
    return out;
}
const ALL_RECIPES = gatherAllRecipes();

// Automatyczne inputy z glow tylko na focusie
function addInputField(focusNow = false) {
    let input = document.createElement("input");
    input.type = "text";
    input.className = "recipe-search-input";
    input.placeholder = "Wpisz składnik lub właściwości…";
    input.autocomplete = "off";
    input.addEventListener('input', handleInputFields);
    input.addEventListener('focus', updateGlow);
    input.addEventListener('blur', updateGlow);
    searchInputsDiv.appendChild(input);
    if (focusNow) input.focus();
    updateGlow();
}

function updateGlow() {
    document.querySelectorAll('.recipe-search-input').forEach(inp => inp.classList.remove('glow'));
    let active = document.activeElement;
    if (active && active.classList.contains('recipe-search-input')) active.classList.add('glow');
}

function handleInputFields(e) {
    let inputs = Array.from(document.querySelectorAll('.recipe-search-input'));
    let values = inputs.map(i => i.value);
    // Usuń zbędne puste inputy (zostaw jeden pusty na końcu)
    for (let i = inputs.length - 2; i >= 0; --i) {
        if (!inputs[i].value && !inputs[i+1].value) {
            inputs[i].remove();
        }
    }
    // Dodaj nowe pole tylko jeśli ostatnie jest poprawne
    let last = inputs[inputs.length-1];
    if (last && validQuery(last.value) && inputs.length < 6) {
        addInputField();
    }
    // Jeśli wszystko puste – zostaje jedno pole
    if (!searchInputsDiv.querySelector('.recipe-search-input')) addInputField();
    updateGlow();
    triggerSearch();
}

function clearInputs() {
    searchInputsDiv.innerHTML = '';
    addInputField(true);
    triggerSearch();
}

// Kolorowe podświetlanie fraz
function highlightMultiple(text, queries) {
    let colors = ["#fceb94", "#a3e2e6", "#b2ffb6", "#ffb4b4", "#d1c3f7", "#ffd1b3"];
    queries.forEach((q, idx) => {
        if(q.length > 0) {
            let rgx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), "gi");
            text = text.replace(rgx, match => `<span style="background:${colors[idx % colors.length]};color:#222;border-radius:4px;padding:0 0.13em;">${match}</span>`);
        }
    });
    return text;
}

// Wyniki w eleganckiej sekcji
function triggerSearch() {
    let queries = Array.from(document.querySelectorAll('.recipe-search-input'))
        .map(e => e.value.trim().toLowerCase())
        .filter(validQuery);

    let resultsDiv = document.getElementById("searchResults");
    let resultsTitle = document.querySelector(".results-title");
    if(queries.length === 0) {
        resultsDiv.innerHTML = "<i>Wpisz co najmniej jedno słowo kluczowe (3–120 znaków)…</i>";
        if(resultsTitle) resultsTitle.style.display = "none";
        return;
    }
    let found = ALL_RECIPES.filter(({przepis}) => {
        return queries.every(q =>
            (przepis.skladniki && przepis.skladniki.some(s => s.toLowerCase().includes(q))) ||
            (przepis.wlasciwosci && przepis.wlasciwosci.some(w => w.toLowerCase().includes(q))) ||
            (przepis.cechy && przepis.cechy.some(c => c.toLowerCase().includes(q))) ||
            (przepis.zastosowanie && przepis.zastosowanie.toLowerCase().includes(q)) ||
            (przepis.sposob_przygotowania && przepis.sposob_przygotowania.toLowerCase().includes(q)) ||
            (przepis.nazwa && przepis.nazwa.toLowerCase().includes(q))
        );
    });
    if(found.length === 0) {
        resultsDiv.innerHTML = "<div style='margin-top:1.5em;color:#c43;font-weight:bold;'>Brak przepisów spełniających wszystkie warunki.</div>";
        if(resultsTitle) resultsTitle.style.display = "";
        return;
    }
    if(resultsTitle) resultsTitle.style.display = "";
    let html = `<ul class="search-results">`;
    found.forEach(({typ, plant, nazwa, przepis}) => {
        html += `
        <li class="result-item">
            <div class="plant-title">
                <a href="/${plant.category}/${plant.slug}">${plant.name}</a>
                <span class="latin">(${plant.latin})</span>
                <span class="przepis-type">${typ.replace('-',' ')}</span>
            </div>
            <div class="przepis-title">${highlightMultiple(nazwa, queries)}</div>
            <div class="przepis-content">
                <b>Składniki:</b>
                <ul>${(przepis.skladniki||[]).map(s => `<li>${highlightMultiple(s, queries)}</li>`).join('')}</ul>
                ${przepis.sposob_przygotowania ? `<b>Sposób przygotowania:</b> <div>${highlightMultiple(przepis.sposob_przygotowania, queries)}</div>` : ''}
                ${przepis.cechy ? `<b>Cechy:</b> <ul>${(przepis.cechy||[]).map(c=>`<li>${highlightMultiple(c, queries)}</li>`).join('')}</ul>` : ''}
                ${przepis.wlasciwosci ? `<b>Właściwości:</b> <ul>${(przepis.wlasciwosci||[]).map(w=>`<li>${highlightMultiple(w, queries)}</li>`).join('')}</ul>` : ''}
                ${przepis.zastosowanie ? `<b>Zastosowanie:</b> <div>${highlightMultiple(przepis.zastosowanie, queries)}</div>` : ''}
                ${przepis.dawkowanie ? `<b>Dawkowanie:</b> <div>${highlightMultiple(przepis.dawkowanie, queries)}</div>` : ''}
            </div>
        </li>
        `;
    });
    html += `</ul>`;
    resultsDiv.innerHTML = html;
}

// Eksport do PDF zachowujący wygląd
function exportResultsToPDF() {
    // Zamiast eksportować od razu, pokaż dialog!
    let dialog = document.getElementById('pdf-export-dialog');
    if (!dialog) return;
    let resultsSection = document.getElementById('results-section');
    if (!resultsSection || resultsSection.querySelectorAll('.result-item').length === 0) {
        alert("Brak wyników do eksportu!");
        return;
    }
    // Zresetuj wartości
    document.getElementById('pdf-include-highlights').checked = true;
    document.getElementById('pdf-font-scale').value = 1.0;
    dialog.style.display = "flex";
    // Focus na pierwszym
    setTimeout(() => document.getElementById('pdf-include-highlights').focus(), 30);
    // Zablokuj przewijanie strony pod spodem
    document.body.style.overflow = "hidden";
}

// Obsługa dialogu i eksportu PDF z logo
document.getElementById('pdf-dialog-form').onsubmit = function(e) {
    e.preventDefault();
    hidePdfDialog();
    // Pobierz opcje
    let highlights = document.getElementById('pdf-include-highlights').checked;
    let scale = parseFloat(document.getElementById('pdf-font-scale').value.replace(",", "."));
    if (isNaN(scale) || scale < 0.5) scale = 0.5;
    if (scale > 1.5) scale = 1.5;

    // Tworzymy tymczasowy klon z odpowiednimi modyfikacjami
    let section = document.getElementById('results-section');
    let clone = section.cloneNode(true);

    // --- DODAJ BLOK Z LOGO + NAZWĄ ---
    let logoDiv = document.createElement('div');
    logoDiv.style.display = 'flex';
    logoDiv.style.alignItems = 'center';
    logoDiv.style.gap = '1.1em';
    logoDiv.style.marginBottom = '1.6em';
    logoDiv.style.marginTop = '0.4em';
    logoDiv.innerHTML = `
        <img src="/static/img/kwiatownik_logo.png" alt="Kwiatownik" style="height:54px;width:auto;display:inline;">
        <span style="font-size:2.3em;font-weight:bold;color:#184e10;font-family:'Inter',Arial,sans-serif;letter-spacing:0.01em;">Kwiatownik</span>
    `;
    clone.insertBefore(logoDiv, clone.firstChild);

    // --- USUŃ tytuł "Wyniki wyszukiwania" z PDF ---
    clone.querySelectorAll('.results-title').forEach(el => el.remove());

    // Podświetlenia: usuń jeśli wyłączone (zamień span na czysty tekst)
    if (!highlights) {
        clone.querySelectorAll('span').forEach(s => {
            if (s.style.background && s.style.background.startsWith('rgb')) {
                let txt = document.createTextNode(s.textContent);
                s.parentNode.replaceChild(txt, s);
            }
            if (s.style.background && s.style.background.match(/^#(fceb94|a3e2e6|b2ffb6|ffb4b4|d1c3f7|ffd1b3)/i)) {
                let txt = document.createTextNode(s.textContent);
                s.parentNode.replaceChild(txt, s);
            }
        });
    }
    // Zwiększ/zmniejsz font-size w wynikach
    let base = 1.01 * scale;
    let title = 1.17 * scale;
    let subtitle = 1.09 * scale;
    clone.querySelectorAll('.result-item').forEach(card => {
        card.style.fontSize = base + "em";
        let t = card.querySelector('.plant-title');
        if (t) t.style.fontSize = title + "em";
        let s = card.querySelector('.przepis-title');
        if (s) s.style.fontSize = subtitle + "em";
    });

    // Ustaw skalowanie całości (np. marginesy też)
    clone.style.fontSize = (1.0 * scale) + "em";

    // Usuń przyciski, jeśli jakieś się skopiowały (niepotrzebne w PDF)
    clone.querySelectorAll('button,.export-pdf-btn,.clear-all-btn').forEach(btn => btn.style.display = "none");

    // Eksport przez html2pdf z aktualną skalą
    let opt = {
        margin: 0.18 * scale,
        filename: 'przepisy-wyniki.pdf',
        image: { type: 'jpeg', quality: 0.97 },
        html2canvas: { scale: 2.2, backgroundColor: null },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(clone).save();
};

function hidePdfDialog() {
    document.getElementById('pdf-export-dialog').style.display = "none";
    document.body.style.overflow = "";
}

// Obsługa dialogu i eksportu
document.getElementById('pdf-dialog-form').onsubmit = function(e) {
    e.preventDefault();
    hidePdfDialog();
    // Pobierz opcje
    let highlights = document.getElementById('pdf-include-highlights').checked;
    let scale = parseFloat(document.getElementById('pdf-font-scale').value.replace(",", "."));
    if(isNaN(scale) || scale < 0.5) scale = 0.5;
    if(scale > 1.5) scale = 1.5;

    // Tworzymy tymczasowy klon z odpowiednimi modyfikacjami
    let section = document.getElementById('results-section');
    let clone = section.cloneNode(true);

    // Podświetlenia: usuń jeśli wyłączone (zamień span na czysty tekst)
    if(!highlights) {
        clone.querySelectorAll('span').forEach(s=>{
            if(s.style.background && s.style.background.startsWith('rgb')) {
                let txt = document.createTextNode(s.textContent);
                s.parentNode.replaceChild(txt, s);
            }
            if(s.style.background && s.style.background.match(/^#(fceb94|a3e2e6|b2ffb6|ffb4b4|d1c3f7|ffd1b3)/i)) {
                let txt = document.createTextNode(s.textContent);
                s.parentNode.replaceChild(txt, s);
            }
        });
    }
    // Zwiększ/zmniejsz font-size w wynikach
    let base = 1.01 * scale;
    let title = 1.17 * scale;
    let subtitle = 1.09 * scale;
    clone.querySelectorAll('.result-item').forEach(card=>{
        card.style.fontSize = base + "em";
        let t = card.querySelector('.plant-title');
        if(t) t.style.fontSize = title + "em";
        let s = card.querySelector('.przepis-title');
        if(s) s.style.fontSize = subtitle + "em";
    });

    // Ustaw skalowanie całości (np. marginesy też)
    clone.style.fontSize = (1.0 * scale) + "em";

    // Usuń przyciski, jeśli jakieś się skopiowały (niepotrzebne w PDF)
    clone.querySelectorAll('button,.export-pdf-btn,.clear-all-btn').forEach(btn=>btn.style.display="none");

    // Eksport przez html2pdf z aktualną skalą
    let opt = {
        margin:       0.18 * scale,
        filename:     'przepisy-wyniki.pdf',
        image:        { type: 'jpeg', quality: 0.97 },
        html2canvas:  { scale: 2.2, backgroundColor: null },
        jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(clone).save();
};

// Pozwól zamknąć dialog Esc lub klikając w tło
document.getElementById('pdf-dialog-bg').onclick = hidePdfDialog;
window.addEventListener('keydown', e=>{
    if(e.key==="Escape" && document.getElementById('pdf-export-dialog').style.display==="flex") {
        hidePdfDialog();
    }
});


// Inicjalizacja na starcie
searchInputsDiv.innerHTML = '';
addInputField();
triggerSearch();

</script>

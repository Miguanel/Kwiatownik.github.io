{% extends "base.html" %}
{% block title %}Generator przepisów{% endblock %}
{% block content %}

<h2>Znajdź przepis według składników i efektów</h2>
<div class="search-recipes-panel">
  <form id="recipeQueryForm" autocomplete="off" onsubmit="return false;">
    <div id="search-inputs"></div>
    <button type="button" id="add-input-btn" class="btn-add">➕ Dodaj składnik</button>
    <div class="actions-row">
      <button type="button" id="open-pdf-btn" class="export-pdf-btn">Export wyników do PDF</button>
      <button type="button" class="clear-all-btn">Wyczyść wszystko</button>
    </div>
  </form>
</div>

<section id="results-section">
  <div id="searchResults"><i>Wpisz co najmniej jedno słowo kluczowe (3–120 znaków)…</i></div>
</section>

<div id="pdf-export-dialog" style="display:none;">
  <div id="pdf-dialog-bg"></div>
  <form id="pdf-dialog-form">
    <h3>Eksport wyników do PDF – opcje</h3>
    <label><input type="checkbox" id="pdf-include-highlights" checked> Kolorowe podświetlenia wyszukiwanych fraz</label>
    <label>Skalowanie czcionki w PDF:<br>
      <input type="number" id="pdf-font-scale" value="1.0" step="0.1" min="0.5" max="1.5">
      <span>(0.5–1.5, domyślnie 1.0)</span>
    </label>
    <div class="pdf-actions">
      <button type="submit" class="export-pdf-btn">Eksportuj PDF</button>
      <button type="button" class="clear-all-btn" onclick="hidePdfDialog()">Anuluj</button>
    </div>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const allPlants = {{ all_plants|tojson|safe }};
    const MAX_INPUTS = 6;
    const searchInputsDiv = document.getElementById('search-inputs');
    const addInputBtn = document.getElementById('add-input-btn');

    function validQuery(val) { return typeof val === 'string' && val.length >= 3 && val.length <= 120; }
    function gatherAllRecipes() {
      const out = [];
      allPlants.forEach(plant => {
        ['przepisy_medyczne','przepisy_kulinarne'].forEach(type => {
          const group = plant.data[type]||{};
          Object.entries(group).forEach(([nazwa,przepis]) => out.push({ typ: type==='przepisy_medyczne'?'medyczny':'kulinarny', plant, nazwa, przepis }));
        });
        const others = plant.data.przepisy_z_innymi_roslinami||{};
        Object.entries(others).forEach(([sub,arr])=>arr.forEach(p=>out.push({ typ: sub==='medyczne'?'medyczny-z-innych':'kulinarny-z-innych', plant, nazwa:p.nazwa, przepis:p })));
      }); return out;
    }
    const ALL_RECIPES = gatherAllRecipes();

    function addInputField() {
      if (searchInputsDiv.querySelectorAll('input').length>=MAX_INPUTS) return;
      const input = document.createElement('input');
      input.type='text'; input.className='recipe-search-input';
      input.placeholder='Wpisz składnik lub właściwości…'; input.autocomplete='off';
      input.addEventListener('input',handleInputFields);
      searchInputsDiv.appendChild(input); input.focus();
    }

    function handleInputFields() {
      const inputs=Array.from(document.querySelectorAll('.recipe-search-input'));
      for(let i=inputs.length-2;i>=0;i--) if(!inputs[i].value&&!inputs[i+1].value) inputs[i].remove();
      triggerSearch();
    }

    function clearInputs(){ searchInputsDiv.innerHTML=''; addInputField(); addInputField(); triggerSearch(); }

    function highlightMultiple(text,queries){
      const colors=['#fceb94','#a3e2e6','#b2ffb6','#ffb4b4','#d1c3f7','#ffd1b3'];
      return queries.reduce((acc,q,idx)=>{ if(!q) return acc; const esc=q.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&'); const rgx=new RegExp(esc,'gi'); return acc.replace(rgx,m=>`<span class="highlight-${idx}">${m}</span>`); }, text);
    }

    function formatTitle(raw){ const s=raw.replaceAll('_',' '); return s.charAt(0).toUpperCase()+s.slice(1); }

    function triggerSearch(){
      const queries=Array.from(document.querySelectorAll('.recipe-search-input')).map(i=>i.value.trim().toLowerCase()).filter(validQuery);
      const resultsDiv=document.getElementById('searchResults');
      if(!queries.length){ resultsDiv.innerHTML='<i>Wpisz co najmniej jedno słowo kluczowe (3–120 znaków)…</i>'; return; }
      const found=ALL_RECIPES.filter(({przepis,nazwa})=>queries.every(q=>
        (Array.isArray(przepis.skladniki)&&przepis.skladniki.some(s=>typeof s==='string'&&s.toLowerCase().includes(q)))||
        (Array.isArray(przepis.wlasciwosci)&&przepis.wlasciwosci.some(w=>typeof w==='string'&&w.toLowerCase().includes(q)))||
        (Array.isArray(przepis.cechy)&&przepis.cechy.some(c=>typeof c==='string'&&c.toLowerCase().includes(q)))||
        (typeof przepis.zastosowanie==='string'&&przepis.zastosowanie.toLowerCase().includes(q))||
        (typeof przepis.sposob_przygotowania==='string'&&przepis.sposob_przygotowania.toLowerCase().includes(q))||
        nazwa.toLowerCase().includes(q)
      ));
      if(!found.length){ resultsDiv.innerHTML='<div class="no-results">Brak przepisów spełniających warunki.</div>'; return; }
      let html='<ul class="search-results">';
      found.forEach(({typ,plant,nazwa,przepis})=>{
        html+=`<li class="result-item"><div class="plant-title"><a href="/${plant.category}/${plant.slug}">${plant.name}</a><span class="latin">(${plant.latin})</span><span class="przepis-type">${typ.replace('-',' ')}</span></div>`+
              `<div class="przepis-title">${highlightMultiple(formatTitle(nazwa),queries)}</div>`+
              `<div class="przepis-content"><b>Składniki:</b><ul>`+(przepis.skladniki||[]).map(s=>`<li>${highlightMultiple(s,queries)}</li>`).join('')+`</ul>`+
              (typeof przepis.sposob_przygotowania==='string'?`<b>Sposób przygotowania:</b><div>${highlightMultiple(przepis.sposob_przygotowania,queries)}</div>`:'')+
              (Array.isArray(przepis.cechy)?`<b>Cechy:</b><ul>`+przepis.cechy.map(c=>`<li>${highlightMultiple(c,queries)}</li>`).join('')+`</ul>`:'')+
              (Array.isArray(przepis.wlasciwosci)?`<b>Właściwości:</b><ul>`+przepis.wlasciwosci.map(w=>`<li>${highlightMultiple(w,queries)}</li>`).join('')+`</ul>`:'')+
              (typeof przepis.zastosowanie==='string'?`<b>Zastosowanie:</b><div>${highlightMultiple(przepis.zastosowanie,queries)}</div>`:'')+
              (typeof przepis.dawkowanie==='string'?`<b>Dawkowanie:</b><div>${highlightMultiple(przepis.dawkowanie,queries)}</div>`:'')+`</div></li>`;
      }); html+='</ul>'; resultsDiv.innerHTML=html;
    }

    function exportResultsToPDF(){ const d=document.getElementById('pdf-export-dialog'); if(!document.querySelector('.result-item')) return alert('Brak wyników do eksportu!'); d.style.display='flex'; document.body.style.overflow='hidden'; }
    function hidePdfDialog(){ document.getElementById('pdf-export-dialog').style.display='none'; document.body.style.overflow=''; }
    document.getElementById('pdf-dialog-form').addEventListener('submit',e=>{ e.preventDefault(); hidePdfDialog(); let scale=parseFloat(document.getElementById('pdf-font-scale').value)||1.0; scale=Math.min(Math.max(scale,0.5),1.5); const highlights=document.getElementById('pdf-include-highlights').checked; const section=document.getElementById('results-section'); const clone=section.cloneNode(true); const logoDiv=document.createElement('div'); logoDiv.className='pdf-logo'; logoDiv.innerHTML=`<img src="/static/img/kwiatownik_logo.png" alt="Kwiatownik"><span>Kwiatownik</span>`; clone.insertBefore(logoDiv,clone.firstChild); if(!highlights) clone.querySelectorAll('span').forEach(s=>s.replaceWith(document.createTextNode(s.textContent))); clone.style.fontSize=scale+'em'; clone.querySelectorAll('button,.export-pdf-btn,.clear-all-btn').forEach(b=>b.style.display='none'); html2pdf().set({margin:0.2*scale,filename:'przepisy-wyniki.pdf',image:{type:'jpeg',quality:0.97},html2canvas:{scale:2.2},jsPDF:{unit:'in',format:'a4',orientation:'portrait'}}).from(clone).save(); });
    document.getElementById('pdf-dialog-bg').addEventListener('click',hidePdfDialog);
    window.addEventListener('keydown',e=>{ if(e.key==='Escape') hidePdfDialog(); });

    addInputBtn.addEventListener('click',addInputField);
    // bind PDF export dialog opening
    const openPdfBtn = document.getElementById('open-pdf-btn');
    openPdfBtn.addEventListener('click', exportResultsToPDF);
    document.querySelector('.clear-all-btn').addEventListener('click',clearInputs);

    searchInputsDiv.innerHTML=''; addInputField(); addInputField(); triggerSearch();
  });
</script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const allPlants = {{ all_plants|tojson|safe }};
    const MAX_INPUTS = 6;
    const searchInputsDiv = document.getElementById('search-inputs');
    const addInputBtn = document.getElementById('add-input-btn');

    function validQuery(val) {
      return typeof val === 'string' && val.length >= 3 && val.length <= 120;
    }

    function gatherAllRecipes() {
      const out = [];
      allPlants.forEach(plant => {
        ['przepisy_medyczne','przepisy_kulinarne'].forEach(type => {
          const group = plant.data[type] || {};
          Object.entries(group).forEach(([nazwa, przepis]) => {
            out.push({ typ: type==='przepisy_medyczne'?'medyczny':'kulinarny', plant, nazwa, przepis });
          });
        });
        const others = plant.data.przepisy_z_innymi_roslinami || {};
        Object.entries(others).forEach(([sub, arr]) => {
          arr.forEach(p => out.push({ typ: sub==='medyczne'?'medyczny-z-innych':'kulinarny-z-innych', plant, nazwa: p.nazwa, przepis: p }));
        });
      });
      return out;
    }
    const ALL_RECIPES = gatherAllRecipes();

    function addInputField() {
      if (searchInputsDiv.querySelectorAll('input').length >= MAX_INPUTS) return;
      const input = document.createElement('input');
      input.type = 'text'; input.className = 'recipe-search-input';
      input.placeholder = 'Wpisz składnik lub właściwości…'; input.autocomplete = 'off';
      input.addEventListener('input', handleInputFields);
      searchInputsDiv.appendChild(input); input.focus();
    }

    function handleInputFields() {
      const inputs = Array.from(document.querySelectorAll('.recipe-search-input'));
      for (let i = inputs.length - 2; i >= 0; i--) {
        if (!inputs[i].value && !inputs[i+1].value) inputs[i].remove();
      }
      triggerSearch();
    }

    function clearInputs() {
      searchInputsDiv.innerHTML = '';
      addInputField(); addInputField(); triggerSearch();
    }

    function highlightMultiple(text, queries) {
      const colors = ['#fceb94','#a3e2e6','#b2ffb6','#ffb4b4','#d1c3f7','#ffd1b3'];
      queries.forEach((q, idx) => {
        if (!q) return;
<!--        const esc = q.replace(/[.*+?^${}()|[\]\]/g, '\$&');-->
        const esc = q;
        const rgx = new RegExp(esc, 'gi');
        text = text.replace(rgx, m => `<span style="background:${colors[idx%colors.length]};padding:0 0.13em;border-radius:4px;">${m}</span>`);
      });
      return text;
    }

    function formatTitle(raw) {
      const s = raw.replaceAll('_',' ');
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function triggerSearch() {
      const queries = Array.from(document.querySelectorAll('.recipe-search-input'))
        .map(i => i.value.trim().toLowerCase())
        .filter(validQuery);
      const resultsDiv = document.getElementById('searchResults');
      if (!queries.length) {
        resultsDiv.innerHTML = '<i>Wpisz co najmniej jedno słowo kluczowe (3–120 znaków)…</i>';
        return;
      }
      const found = ALL_RECIPES.filter(({ przepis, nazwa }) =>
        queries.every(q =>
          (Array.isArray(przepis.skladniki) && przepis.skladniki.some(s => typeof s==='string' && s.toLowerCase().includes(q))) ||
          (Array.isArray(przepis.wlasciwosci) && przepis.wlasciwosci.some(w => typeof w==='string' && w.toLowerCase().includes(q))) ||
          (Array.isArray(przepis.cechy) && przepis.cechy.some(c => typeof c==='string' && c.toLowerCase().includes(q))) ||
          (typeof przepis.zastosowanie==='string' && przepis.zastosowanie.toLowerCase().includes(q)) ||
          (typeof przepis.sposob_przygotowania==='string' && przepis.sposob_przygotowania.toLowerCase().includes(q)) ||
          nazwa.toLowerCase().includes(q)
        )
      );
      if (!found.length) {
        resultsDiv.innerHTML = '<div style="color:#c43;font-weight:bold;">Brak przepisów spełniających warunki.</div>';
        return;
      }
      let html = '<ul class="search-results">';
      found.forEach(({ typ, plant, nazwa, przepis }) => {
        html += `<li class="result-item"><div class="plant-title"><a href="/${plant.category}/${plant.slug}">${plant.name}</a><span class="latin">(${plant.latin})</span><span class="przepis-type">${typ.replace('-',' ')}</span></div><div class="przepis-title">${highlightMultiple(formatTitle(nazwa),queries)}</div><div class="przepis-content"><b>Składniki:</b><ul>` +
                (przepis.skladniki||[]).map(s=>`<li>${highlightMultiple(s,queries)}</li>`).join('') + `</ul>` +
                (typeof przepis.sposob_przygotowania==='string'?`<b>Sposób przygotowania:</b><div>${highlightMultiple(przepis.sposob_przygotowania,queries)}</div>`:'') +
                (Array.isArray(przepis.cechy)?`<b>Cechy:</b><ul>`+przepis.cechy.map(c=>`<li>${highlightMultiple(c,queries)}</li>`).join('')+`</ul>`:'') +
                (Array.isArray(przepis.wlasciwosci)?`<b>Właściwości:</b><ul>`+przepis.wlasciwosci.map(w=>`<li>${highlightMultiple(w,queries)}</li>`).join('')+`</ul>`:'') +
                (typeof przepis.zastosowanie==='string'?`<b>Zastosowanie:</b><div>${highlightMultiple(przepis.zastosowanie,queries)}</div>`:'') +
                (typeof przepis.dawkowanie==='string'?`<b>Dawkowanie:</b><div>${highlightMultiple(przepis.dawkowanie,queries)}</div>`:'') +
                `</div></li>`;
      }); html += '</ul>';
      resultsDiv.innerHTML = html;
    }

    function exportResultsToPDF() {
      const dialog = document.getElementById('pdf-export-dialog');
      if (!document.querySelector('.result-item')) return alert('Brak wyników do eksportu!');
      document.getElementById('pdf-include-highlights').checked = true;
      document.getElementById('pdf-font-scale').value = 1.0;
      dialog.style.display = 'flex'; document.body.style.overflow = 'hidden';
    }

    function hidePdfDialog() { document.getElementById('pdf-export-dialog').style.display = 'none'; document.body.style.overflow = ''; }

    document.getElementById('pdf-dialog-form').addEventListener('submit', e => {
      e.preventDefault(); hidePdfDialog();
      const highlights = document.getElementById('pdf-include-highlights').checked;
      let scale = parseFloat(document.getElementById('pdf-font-scale').value) || 1.0; scale = Math.min(Math.max(scale,0.5),1.5);
      const section = document.getElementById('results-section'); const clone = section.cloneNode(true);
      const logoDiv = document.createElement('div'); logoDiv.style.display='flex'; logoDiv.style.alignItems='center'; logoDiv.style.gap='1em'; logoDiv.style.margin='0 0 1em 0'; logoDiv.innerHTML = `<img src="/static/img/kwiatownik_logo.png" alt="Kwiatownik" style="height:54px;"><span style="font-size:2em;font-weight:bold;color:#184e10;">Kwiatownik</span>`;
      clone.insertBefore(logoDiv, clone.firstChild);
      if (!highlights) clone.querySelectorAll('span').forEach(s => s.replaceWith(document.createTextNode(s.textContent)));
      clone.style.fontSize = scale + 'em'; clone.querySelectorAll('.result-item').forEach(c => c.style.fontSize = (1.01*scale)+'em'); clone.querySelectorAll('button,.export-pdf-btn,.clear-all-btn').forEach(b => b.style.display='none');
      html2pdf().set({ margin:0.2*scale, filename:'przepisy-wyniki.pdf', image:{type:'jpeg',quality:0.97}, html2canvas:{scale:2.2}, jsPDF:{unit:'in',format:'a4',orientation:'portrait'} }).from(clone).save();
    });

    document.getElementById('pdf-dialog-bg').addEventListener('click', hidePdfDialog);
    window.addEventListener('keydown', e => { if (e.key==='Escape') hidePdfDialog(); });

    addInputBtn.addEventListener('click', addInputField);
    document.querySelector('.clear-all-btn').addEventListener('click', clearInputs);

    // initialization
    searchInputsDiv.innerHTML = '';
    addInputField(); addInputField(); triggerSearch();
  });
/**
 * Otwiera dialog eksportu do PDF.
 */
function openExportPdfDialog() {
  const dialog = document.getElementById('pdf-export-dialog');
  // Jeśli brak wyników – nie otwieraj dialogu
  if (!document.querySelector('.result-item')) {
    return alert('Brak wyników do eksportu!');
  }
  dialog.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

/**
 * Zamyka dialog eksportu do PDF.
 */
function hidePdfDialog() {
  const dialog = document.getElementById('pdf-export-dialog');
  dialog.style.display = 'none';
  document.body.style.overflow = '';
}

/**
 * Generuje PDF z sekcji wyników i uruchamia jego pobranie.
 * Uwzględnia:
 *  – podświetlenia (checkbox #pdf-include-highlights)
 *  – skalowanie czcionki (input #pdf-font-scale)
 */
function exportResultsToPDF() {
  // Zanim zaczniemy, schowaj dialog
  hidePdfDialog();

  const includeHighlights = document.getElementById('pdf-include-highlights').checked;
  let scale = parseFloat(document.getElementById('pdf-font-scale').value) || 1.0;
  scale = Math.max(0.5, Math.min(1.5, scale));

  // Klon sekcji, by nie modyfikować oryginału
  const original = document.getElementById('results-section');
  const clone = original.cloneNode(true);

  // Dodaj nagłówek „Kwiatownik”
  const logoDiv = document.createElement('div');
  logoDiv.className = 'pdf-logo';
  logoDiv.innerHTML = `
    <img src="/static/img/kwiatownik_logo.png" alt="Kwiatownik" style="height:54px; margin-right:1em;">
    <span style="font-size:2em; font-weight:bold; color:#184e10;">Kwiatownik</span>
  `;
  clone.insertBefore(logoDiv, clone.firstChild);

  // Jeśli nie chcemy podświetleń – usuń znaczniki <span>
  if (!includeHighlights) {
    clone.querySelectorAll('span').forEach(s => {
      s.replaceWith(document.createTextNode(s.textContent));
    });
  }

  // Skalowanie czcionki
  clone.style.fontSize = scale + 'em';
  clone.querySelectorAll('.result-item').forEach(card => {
    card.style.fontSize = (1.01 * scale) + 'em';
  });

  // Ukryj wszystkie przyciski w klonie
  clone.querySelectorAll('button, .export-pdf-btn, .clear-all-btn').forEach(btn => {
    btn.style.display = 'none';
  });

  // Generuj i pobierz PDF
  html2pdf()
    .set({
      margin:       0.2 * scale,
      filename:     'przepisy-wyniki.pdf',
      image:        { type:'jpeg', quality:0.97 },
      html2canvas:  { scale:2.2 },
      jsPDF:        { unit:'in', format:'a4', orientation:'portrait' }
    })
    .from(clone)
    .save();
}

/**
 * Podpinamy przyciski – najlepiej poza jakimkolwiek IIFE, globalnie:
 */
document.querySelector('.export-pdf-btn').addEventListener('click', openExportPdfDialog);
document.getElementById('pdf-dialog-bg').addEventListener('click', hidePdfDialog);
document.getElementById('pdf-dialog-form').addEventListener('submit', e => {
  e.preventDefault();
  exportResultsToPDF();
});

</script>

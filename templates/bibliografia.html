{% extends "base.html" %}
{% block title %}Bibliografia{% endblock %}
{% block content %}
<h2>Bibliografia / Źródła</h2>
<ul style="font-size:1.1em;">
    {% for num, url in bibliografia.items() %}
    <li id="bib{{ num }}">[{{ num }}] <a href="{{ url }}" target="_blank">{{ url }}</a></li>
    {% endfor %}
</ul>
<a href="javascript:history.back()" class="back-link">← Powrót</a>
{% endblock %}

{% extends "base.html" %}
{% block title %}Strona główna{% endblock %}
{% block content %}
<h2>Wybierz kategorię roślin</h2>
<ul>
    {% for cat, plants in categories %}
    <li>
        <a href="{{ url_for('lista', category=cat) }}">{{ cat|capitalize }}</a>
        ({{ plants|length }} roślin)
    </li>
    {% endfor %}
</ul>
{% endblock %}

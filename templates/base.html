<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kwiatownik{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.ico">
    <!--    <link rel="icon" href="{{ url_for('static', filename='img/kwiatownik_logo.png') }}">-->
    <script src="/static/main.js"></script>
    <script src="/static/script.js"></script>
    <script src="/static/js/favs.js"></script>
</head>
<body>
<div class="wrapper">
    <header class="top-bar">
        <a href="/" class="logo" style="display:flex;align-items:center;gap:0.7em;text-decoration:none;">
            <img src="{{ url_for('static', filename='img/kwiatownik_logo.png') }}"
                 alt="Kwiatownik"
                 style="height:38px;width:auto;display:inline-block;border-radius:7px;box-shadow:0 1px 3px #0001;">
            <span style="font-size:1.13em;vertical-align:middle;color:#184e10;font-weight:bold;letter-spacing:0.01em;">
            Kwiatownik
        </span>
        </a>
        <nav class="main-navbar">
            <a href="/ulubione">Ulubione w ogrodzie</a>
            <a href="/generator_przepisow">Generator przepisów - mam to</a>
        </nav>
        <button class="search-btn" aria-label="Szukaj roślin" onclick="window.location.href='/szukaj'">🔍</button>
        <!--    <button id="darkToggle" aria-label="Tryb ciemny" onclick="toggleDarkMode()">🌙</button>-->
    </header>

    <main>
        <div class="page">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer>
        <small>&copy; {{ now().year if now else '1936' }} Kwiatownik. Wszelkie prawa zastrzeżone.</small>
    </footer>
</div>

<script>

const allPlantsData = {{ all_plants|tojson|safe }};
let searchInputsDiv = document.getElementById("search-inputs");

// Funkcja walidacji frazy
function validQuery(val) {
    return val.length >= 3 && val.length <= 120;
}

// Zbierz przepisy (identycznie jak wcześniej)
function gatherAllRecipes() {
    let out = [];
    allPlantsData.forEach(plant => {
        ["przepisy_medyczne", "przepisy_kulinarne"].forEach(type => {
            let group = plant.data[type] || {};
            Object.entries(group).forEach(([nazwa, przepis]) => {
                out.push({
                    typ: type.includes("medyczne") ? "medyczny" : "kulinarny",
                    plant: plant,
                    nazwa: nazwa,
                    przepis: przepis
                });
            });
        });
        let zinnymi = plant.data.przepisy_z_innymi_roslinami || {};
        Object.entries(zinnymi).forEach(([podtyp, arr]) => {
            arr.forEach(przepis => {
                out.push({
                    typ: podtyp == "medyczne" ? "medyczny-z-innych" : "kulinarny-z-innych",
                    plant: plant,
                    nazwa: przepis.nazwa,
                    przepis: przepis
                });
            });
        });
    });
    return out;
}
const ALL_RECIPES = gatherAllRecipes();

function addInputField() {
    let input = document.createElement("input");
    input.type = "text";
    input.className = "recipe-search-input glow";
    input.placeholder = "Wpisz składnik lub właściwości…";
    input.autocomplete = "off";
    input.addEventListener('input', handleInputFields);
    searchInputsDiv.appendChild(input);
    input.focus();
}

function handleInputFields() {
    let inputs = Array.from(document.querySelectorAll('.recipe-search-input'));
    let values = inputs.map(i => i.value);
    let validCount = values.filter(validQuery).length;

    // Usuń zbędne puste inputy (zostawiając jeden pusty na końcu!)
    for (let i = inputs.length - 2; i >= 0; --i) {
        if (!inputs[i].value && !inputs[i+1].value) {
            inputs[i].remove();
        }
    }
    // Jeśli ostatni input jest niepusty i poprawny, dodaj nowy (max 6)
    let last = inputs[inputs.length-1];
    if (last && validQuery(last.value) && inputs.length < 6) {
        if (!Array.from(searchInputsDiv.children).includes(document.activeElement)) addInputField();
        else setTimeout(addInputField, 0); // Jeśli focus, dodaj później
    }
    // Jeśli usunięto wszystko – dodaj jedno puste pole
    if (!searchInputsDiv.querySelector('.recipe-search-input')) addInputField();

    triggerSearch();
}

function clearInputs() {
    searchInputsDiv.innerHTML = '';
    addInputField();
    triggerSearch();
}

// Podświetlanie fraz w tekście na różne kolory
function highlightMultiple(text, queries) {
    let colors = ["#fceb94", "#a3e2e6", "#b2ffb6", "#ffb4b4", "#d1c3f7", "#ffd1b3"];
    queries.forEach((q, idx) => {
        if(q.length > 0) {
            let rgx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), "gi");
            text = text.replace(rgx, match => `<span style="background:${colors[idx % colors.length]};color:#222;border-radius:4px;padding:0 0.13em;">${match}</span>`);
        }
    });
    return text;
}

// Szukanie przepisów
function triggerSearch() {
    let queries = Array.from(document.querySelectorAll('.recipe-search-input'))
        .map(e => e.value.trim().toLowerCase())
        .filter(validQuery);

    let resultsDiv = document.getElementById("searchResults");
    if(queries.length === 0) {
        resultsDiv.innerHTML = "<i>Wpisz co najmniej jedno słowo kluczowe (3–120 znaków)…</i>";
        return;
    }
    // Filtrowanie przepisów
    let found = ALL_RECIPES.filter(({przepis}) => {
        return queries.every(q =>
            (przepis.skladniki && przepis.skladniki.some(s => s.toLowerCase().includes(q))) ||
            (przepis.wlasciwosci && przepis.wlasciwosci.some(w => w.toLowerCase().includes(q))) ||
            (przepis.cechy && przepis.cechy.some(c => c.toLowerCase().includes(q))) ||
            (przepis.zastosowanie && przepis.zastosowanie.toLowerCase().includes(q)) ||
            (przepis.sposob_przygotowania && przepis.sposob_przygotowania.toLowerCase().includes(q)) ||
            (przepis.nazwa && przepis.nazwa.toLowerCase().includes(q))
        );
    });

    if(found.length === 0) {
        resultsDiv.innerHTML = "<div style='margin-top:1.5em;color:#c43;font-weight:bold;'>Brak przepisów spełniających wszystkie warunki.</div>";
        return;
    }
    let html = `<ul class="search-results">`;
    found.forEach(({typ, plant, nazwa, przepis}) => {
        html += `
        <li class="result-item">
            <div class="plant-title">
                <a href="/${plant.category}/${plant.slug}">${plant.name}</a>
                <span class="latin">(${plant.latin})</span>
                <span style="margin-left:0.7em;font-size:0.98em;background:#e8f7df;padding:0.2em 0.6em;border-radius:7px;">${typ.replace('-',' ')}</span>
            </div>
            <div class="przepis-title" style="font-weight:bold;font-size:1.07em;margin:0.7em 0;">${highlightMultiple(nazwa, queries)}</div>
            <div class="przepis-content">
                <b>Składniki:</b>
                <ul>${(przepis.skladniki||[]).map(s => `<li>${highlightMultiple(s, queries)}</li>`).join('')}</ul>
                ${przepis.sposob_przygotowania ? `<b>Sposób przygotowania:</b> <div>${highlightMultiple(przepis.sposob_przygotowania, queries)}</div>` : ''}
                ${przepis.cechy ? `<b>Cechy:</b> <ul>${(przepis.cechy||[]).map(c=>`<li>${highlightMultiple(c, queries)}</li>`).join('')}</ul>` : ''}
                ${przepis.wlasciwosci ? `<b>Właściwości:</b> <ul>${(przepis.wlasciwosci||[]).map(w=>`<li>${highlightMultiple(w, queries)}</li>`).join('')}</ul>` : ''}
                ${przepis.zastosowanie ? `<b>Zastosowanie:</b> <div>${highlightMultiple(przepis.zastosowanie, queries)}</div>` : ''}
                ${przepis.dawkowanie ? `<b>Dawkowanie:</b> <div>${highlightMultiple(przepis.dawkowanie, queries)}</div>` : ''}
            </div>
        </li>
        `;
    });
    html += `</ul>`;
    resultsDiv.innerHTML = html;
}

// Inicjalizacja – tylko 1 pole na start
if (searchInputsDiv) {
    searchInputsDiv.innerHTML = '';
    addInputField();
    triggerSearch();
}


</script>

<a href="https://zrzutka.pl/72a4ab" target="_blank" id="kawa-widget" title="Postaw mi kawę!">
  <div class="kawa-widget-illu">
  </div>
  <span class="kawa-widget-text">
    <b>☕ Postaw mi kawę</b>
  </span>
</a>

</body>
</html>
